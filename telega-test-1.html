<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telega.io Ad Test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

    :root {
      --bg: #0a0a0f;
      --card: #13131a;
      --border: #2a2a3a;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
      --success: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 12px;
    }

    .badge {
      display: inline-block;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.4);
      color: #a78bfa;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
      font-family: 'Space Mono', monospace;
    }

    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse-dot 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .status-text { font-size: 13px; color: var(--text); font-weight: 700; }
    .status-sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: 'Space Mono', monospace; }

    .ad-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent2);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    #ad-slot-placeholder {
      min-height: 80px;
      background: rgba(124,58,237,0.05);
      border: 1px dashed rgba(124,58,237,0.3);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    #ad-slot-placeholder.ad-loaded {
      border-color: var(--success);
      background: rgba(16,185,129,0.05);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9333ea);
      color: white;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
    }

    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124,58,237,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 10px;
    }

    .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .info-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .info-val {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .info-key {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .log-box {
      background: #0d0d14;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      max-height: 160px;
      overflow-y: auto;
    }

    .log-entry {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex;
      gap: 8px;
    }

    .log-entry .time { color: var(--accent); flex-shrink: 0; }
    .log-entry.ok .msg { color: var(--success); }
    .log-entry.err .msg { color: #f87171; }
    .log-entry.info .msg { color: var(--accent2); }

    .footer {
      text-align: center;
      margin-top: 8px;
      margin-bottom: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .footer a { color: #a78bfa; text-decoration: none; }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="badge">🧪 Test Mode</div>
    <h1>Telega.io<br>Ad Test Page</h1>
    <p class="subtitle">GitHub Pages Compatible</p>
  </div>

  <div class="status-card">
    <div class="status-dot" id="status-dot"></div>
    <div>
      <div class="status-text" id="sdk-status">SDK Loading...</div>
      <div class="status-sub" id="tg-status">Checking Telegram WebApp...</div>
    </div>
  </div>

  <div class="info-grid">
    <div class="info-box">
      <div class="info-val" id="imp-count">0</div>
      <div class="info-key">Ad Shown</div>
    </div>
    <div class="info-box">
      <div class="info-val" id="err-count">0</div>
      <div class="info-key">Errors</div>
    </div>
  </div>

  <!-- Ad Section -->
  <div class="ad-section">
    <div class="section-label">Ad Block</div>
    <div id="ad-slot-placeholder">AD WILL APPEAR HERE</div>
    <button class="btn btn-primary" style="margin-top:14px" id="show-ad-btn" onclick="showAd()">
      ▶ Show Ad
    </button>
  </div>

  <!-- Log -->
  <div class="log-box" id="log-box">
    <div class="log-entry info">
      <span class="time">--:--:--</span>
      <span class="msg">Page loaded. Initializing SDK...</span>
    </div>
  </div>

  <button class="btn btn-secondary" onclick="location.reload()">↺ Reload Page</button>

  <div class="footer">
    Reward Software &middot; <a href="https://telega.io/tma" target="_blank">telega.io/tma</a>
  </div>

</div>

<!-- Telegram WebApp SDK -->
<!-- Telega.io SDK -->
<script src="https://inapp.telega.io/sdk/v1/sdk.js"></script>

<script>
  let adShown = 0;
  let errCount = 0;
  let ads = null;

  const AD_BLOCK_UUID = "0d94d9fc-7314-40ac-a45c-8d0c7ba9482c";
  const TOKEN = "e8f424c5-34c4-4312-b839-6b6889d12180";

  function ts() {
    const n = new Date();
    return [n.getHours(), n.getMinutes(), n.getSeconds()]
      .map(x => x.toString().padStart(2,'0')).join(':');
  }

  function log(msg, type = 'info') {
    const box = document.getElementById('log-box');
    const el = document.createElement('div');
    el.className = 'log-entry ' + type;
    el.innerHTML = '<span class="time">' + ts() + '</span><span class="msg">' + msg + '</span>';
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function setStatus(text, sub, ok) {
    document.getElementById('sdk-status').textContent = text;
    document.getElementById('tg-status').textContent = sub;
    const dot = document.getElementById('status-dot');
    dot.style.background = ok ? 'var(--success)' : '#f87171';
    dot.style.boxShadow = ok ? '0 0 8px var(--success)' : '0 0 8px #f87171';
  }

  // Telegram WebApp check
  function checkTelegram() {
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      const name = tg.initDataUnsafe?.user?.first_name || 'Unknown';
      document.getElementById('tg-status').textContent = 'TG WebApp ✓ | User: ' + name;
      log('Telegram WebApp initialized ✓', 'ok');
    } else {
      document.getElementById('tg-status').textContent = 'Browser mode (not in Telegram)';
      log('Browser mode — open inside Telegram for real ads', 'info');
    }
  }

  // Init Telega SDK
  function initSDK() {
    try {
      if (!window.TelegaIn) {
        throw new Error('TelegaIn not found on window');
      }
      ads = window.TelegaIn.AdsController.create_miniapp({ token: TOKEN });
      setStatus('Telega SDK Ready ✓', document.getElementById('tg-status').textContent, true);
      log('TelegaIn SDK initialized ✓', 'ok');
      log('Token: ' + TOKEN.substring(0,8) + '...', 'info');
      document.getElementById('show-ad-btn').disabled = false;
    } catch(e) {
      errCount++;
      document.getElementById('err-count').textContent = errCount;
      setStatus('SDK Error ✗', 'Check console for details', false);
      log('SDK init failed: ' + e.message, 'err');
      document.getElementById('show-ad-btn').disabled = true;
    }
  }

  // Show Ad
  function showAd() {
    if (!ads) {
      log('SDK not ready yet!', 'err');
      return;
    }

    log('Calling ads.ad_show()...', 'info');
    const btn = document.getElementById('show-ad-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Loading Ad...';

    try {
      ads.ad_show({
        adBlockUuid: AD_BLOCK_UUID,
        onAdShow: function() {
          adShown++;
          document.getElementById('imp-count').textContent = adShown;
          document.getElementById('ad-slot-placeholder').textContent = 'AD SHOWN ✓';
          document.getElementById('ad-slot-placeholder').classList.add('ad-loaded');
          log('Ad shown successfully ✓ (impression #' + adShown + ')', 'ok');
          btn.disabled = false;
          btn.textContent = '▶ Show Ad Again';
        },
        onAdClose: function() {
          log('Ad closed by user', 'info');
          btn.disabled = false;
          btn.textContent = '▶ Show Ad Again';
        },
        onError: function(err) {
          errCount++;
          document.getElementById('err-count').textContent = errCount;
          log('Ad error: ' + (err?.message || JSON.stringify(err)), 'err');
          btn.disabled = false;
          btn.textContent = '▶ Retry Ad';
        }
      });
    } catch(e) {
      errCount++;
      document.getElementById('err-count').textContent = errCount;
      log('ad_show() threw: ' + e.message, 'err');
      btn.disabled = false;
      btn.textContent = '▶ Retry Ad';
    }
  }

  // Boot
  window.addEventListener('DOMContentLoaded', function() {
    checkTelegram();
    // SDK load hone ke liye thoda wait
    setTimeout(function() {
      initSDK();
    }, 600);
  });
</script>

</body>
</html>
